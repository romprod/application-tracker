services:
  application-tracker:
    build:
      context: ..
    image: application-tracker:local
    restart: unless-stopped
    init: true
    env_file:
      - ../.env
    environment:
      BACKUP_DIRECTORY: /app/backups
      DATABASE_PATH: /app/data/application-tracker.sqlite
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: 3333
    ports:
      - "${APPLICATION_TRACKER_BIND_ADDRESS:-127.0.0.1}:${APPLICATION_TRACKER_PORT:-3333}:3333"
    volumes:
      - application-tracker-data:/app/data
      - application-tracker-backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - camoufox-control

  camoufox-worker:
    build:
      context: ../camoufox-worker
      target: worker
    image: application-tracker-camoufox-worker:0.5.4-browser-152.0.4-beta.28
    restart: unless-stopped
    init: true
    user: "65534:65534"
    environment:
      CAMOUFOX_BROWSER_EXECUTABLE: /opt/camoufox/camoufox-bin
      CAMOUFOX_EGRESS_ALLOWED_HOST_SUFFIXES: "${CAMOUFOX_EGRESS_ALLOWED_HOST_SUFFIXES:-indeed.com,indeedcdn.com,indeedstatic.com}"
      CAMOUFOX_EGRESS_PROXY_URL: http://camoufox-egress:8081
      CAMOUFOX_FALLBACK_PROVIDERS: "${CAMOUFOX_FALLBACK_PROVIDERS:-}"
      CAMOUFOX_WORKER_COOLDOWN_MS: "${CAMOUFOX_WORKER_COOLDOWN_MS:-900000}"
      CAMOUFOX_WORKER_ENABLED: "${CAMOUFOX_FALLBACK_ENABLED:-false}"
      CAMOUFOX_WORKER_HOST: 0.0.0.0
      CAMOUFOX_WORKER_MAX_CONCURRENCY: "${CAMOUFOX_WORKER_MAX_CONCURRENCY:-1}"
      CAMOUFOX_WORKER_MIN_INTERVAL_MS: "${CAMOUFOX_WORKER_MIN_INTERVAL_MS:-5000}"
      CAMOUFOX_WORKER_NAVIGATION_TIMEOUT_MS: "${CAMOUFOX_WORKER_NAVIGATION_TIMEOUT_MS:-12000}"
      CAMOUFOX_WORKER_PORT: 8080
      CAMOUFOX_WORKER_TOKEN: "${CAMOUFOX_WORKER_TOKEN:-}"
    depends_on:
      camoufox-egress:
        condition: service_healthy
    networks:
      - camoufox-control
      - camoufox-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
      - /dev/shm:rw,nosuid,nodev,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Camoufox/Firefox peaks above 128 tasks during content-process startup.
    # Keep a bounded margin above the measured 176-179 task canary peak.
    pids_limit: 256
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  camoufox-egress:
    build:
      context: ../camoufox-worker
      target: egress
    image: application-tracker-camoufox-egress:python-3.12.11
    restart: unless-stopped
    init: true
    environment:
      CAMOUFOX_EGRESS_ALLOWED_HOST_SUFFIXES: "${CAMOUFOX_EGRESS_ALLOWED_HOST_SUFFIXES:-indeed.com,indeedcdn.com,indeedstatic.com}"
      CAMOUFOX_EGRESS_HOST: 0.0.0.0
      CAMOUFOX_EGRESS_PORT: 8081
    networks:
      - camoufox-egress
      - camoufox-outbound
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

volumes:
  application-tracker-data:
  application-tracker-backups:

networks:
  camoufox-control:
    internal: true
  camoufox-egress:
    internal: true
  camoufox-outbound:
